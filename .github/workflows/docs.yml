name: Docs
on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

concurrency:
  group: docs-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TABBY_DOCS != '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Installing Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: yarn
        cache-dependency-path: yarn.lock

    - name: Build
      run: |
        sudo apt update && sudo apt install libfontconfig1-dev
        npm i -g yarn
        yarn cache clean
        node scripts/yarn-install-retry.mjs --cwd app
        rm app/node_modules/.yarn-integrity
        node scripts/yarn-install-retry.mjs
        yarn run build:typings
        yarn run docs

      env:
        DOCS_PRIVATE_KEY: ${{ secrets.DOCS_PRIVATE_KEY }}

    - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
      if: github.repository == 'Eugeny/tabby' && env.HAS_FIREBASE_SECRET == 'true'
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TABBY_DOCS }}'
        channelId: live
        projectId: tabby-docs
